name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp android-app/ci-debug.keystore "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature
        run: |
          "$env:ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-bridge-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
